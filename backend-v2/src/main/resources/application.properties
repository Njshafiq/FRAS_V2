server.port=${SERVER_PORT:8081}

# PostgreSQL DataSource Configuration via Environment Variables
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:attendance_db}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
# Development strategy: JPA manages the entity schema; schema.sql is a reference artifact only.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Keep database initialization explicit and non-destructive in all environments.
spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

# JWT/security properties
jwt.secret=${JWT_SECRET:ChangeThisSecretKeyForFRASLocalDevelopmentOnly}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Email
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# AI service integration
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:30000}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.com.college.attendance=DEBUG
